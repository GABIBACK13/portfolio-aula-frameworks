<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <title>Cadastre-se</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
              integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <link href="../css/plain.css" rel="stylesheet">
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-light bg-white mb-4">
            <div class="container">
                <span class="navbar-brand mb-0 h1">Frameworks — CEP</span>
                <div class="navbar-nav">
                    <a class="nav-link" href="../index.htm">Menu</a>
                    <a class="nav-link active" href="index.html">Atividade 2</a>
                    <a class="nav-link" href="../cadastro.htm">Atividade 3</a>
                    <a class="nav-link" href="../atividade4/index.html">Atividade 4</a>
                </div>
            </div>
        </nav>
        <main class="container">
            <h1 class="page-title">Cadastro de endereço</h1>
            <p id="cep-msg" class="text-danger mb-3" hidden></p>
            <form class="row g-3" id="form-endereco">
                <div class="col-md-4">
                    <label for="cep" class="form-label">CEP</label>
                    <input type="text" class="form-control" id="cep" name="cep" maxlength="9" required>
                </div>
                <div class="col-md-8">
                    <label for="rua" class="form-label">Rua</label>
                    <input type="text" class="form-control" id="rua" name="rua" required>
                </div>
                <div class="col-md-4">
                    <label for="bairro" class="form-label">Bairro</label>
                    <input type="text" class="form-control" id="bairro" name="bairro" required>
                </div>
                <div class="col-md-4">
                    <label for="cidade" class="form-label">Cidade</label>
                    <input type="text" class="form-control" id="cidade" name="cidade" required>
                </div>
                <div class="col-md-4">
                    <label for="estado" class="form-label">Estado</label>
                    <input type="text" class="form-control" id="estado" name="estado" maxlength="2" required>
                </div>
                <div class="col-md-4">
                    <label for="numero" class="form-label">Número</label>
                    <input type="text" class="form-control" id="numero" name="numero">
                </div>
                <div class="col-md-8">
                    <label for="complemento" class="form-label">Complemento</label>
                    <input type="text" class="form-control" id="complemento" name="complemento">
                </div>
            </form>
        </main>
        <script src="js/controller.js"></script>
    </body>
</html>
